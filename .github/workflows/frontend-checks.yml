name: Workbench browser checks

on:
  push:
    branches: [main, codex/cross-unit-calculations, codex/enable-account-login, codex/faster-web-entry, codex/general-workbench-labels, codex/admin-add-data, codex/analysis-and-chart-workspace, codex/capability-reference-reports, codex/persistent-analysis-and-office-save, codex/formulas-capability-and-outlier-selection, codex/connect-excluded-chart-points, codex/python-excel-auto-sync, codex/pi-refresh-formulas-daily, codex/device-sync-live-data, codex/live-chart-performance, codex/excel-background-sync, codex/faster-login-paint, codex/dashboard-and-axis-layout, codex/smaller-startup-download, codex/remember-device-overview]
    paths:
      - '*.html'
      - 'frontend/**'
      - 'local_service/**'
      - 'requirements-excel-sync.txt'
      - 'scripts/test-excel-sync.cjs'
      - 'scripts/test-excel-background.cjs'
      - 'scripts/test-excel-auth-resume.cjs'
      - 'scripts/test-pi-daily.cjs'
      - 'scripts/test-device-excel-profiles.cjs'
      - 'scripts/test-live-defaults-and-formulas.cjs'
      - 'scripts/test-live-interactions.cjs'
      - 'scripts/test-dashboard.cjs'
      - 'scripts/test-workspace-memory.cjs'
      - 'scripts/excel-sync-fixture.py'
      - 'scripts/sync-cross-unit-calculations.py'
      - 'scripts/test-cross-unit-calculations.cjs'
      - 'scripts/sync-account-auth.py'
      - 'scripts/test-managed-accounts.cjs'
      - 'scripts/test-backup-merge.cjs'
      - 'scripts/sync-data-analysis.py'
      - 'scripts/test-analysis-math.cjs'
      - 'scripts/test-analysis-point-math.cjs'
      - 'scripts/test-process-capability-and-points.cjs'
      - 'scripts/test-data-analysis.cjs'
      - 'scripts/test-capability-math.cjs'
      - 'scripts/test-capability-reports.cjs'
      - 'scripts/sync-workspace-files.py'
      - 'scripts/test-analysis-session.cjs'
      - 'scripts/test-workspace-files.cjs'
      - 'scripts/workbench-browser-fixture.cjs'
      - 'scripts/test-auth-config.py'
      - 'scripts/check-account-service.py'
      - 'scripts/build-web.py'
      - 'scripts/split-web-spreadsheet.py'
      - 'scripts/test-web-downloads.cjs'
      - 'scripts/test-web-entry.cjs'
      - 'scripts/test-web-auth-bootstrap.cjs'
      - 'scripts/test-general-labels.cjs'
      - 'assets/**'
      - 'supabase/**'
      - '.github/workflows/frontend-checks.yml'
  pull_request:
    paths:
      - '*.html'
      - 'frontend/**'
      - 'local_service/**'
      - 'requirements-excel-sync.txt'
      - 'scripts/test-excel-sync.cjs'
      - 'scripts/test-excel-background.cjs'
      - 'scripts/test-excel-auth-resume.cjs'
      - 'scripts/test-pi-daily.cjs'
      - 'scripts/test-device-excel-profiles.cjs'
      - 'scripts/test-live-defaults-and-formulas.cjs'
      - 'scripts/test-live-interactions.cjs'
      - 'scripts/test-dashboard.cjs'
      - 'scripts/test-workspace-memory.cjs'
      - 'scripts/excel-sync-fixture.py'
      - 'scripts/sync-cross-unit-calculations.py'
      - 'scripts/test-cross-unit-calculations.cjs'
      - 'scripts/sync-account-auth.py'
      - 'scripts/test-managed-accounts.cjs'
      - 'scripts/test-backup-merge.cjs'
      - 'scripts/sync-data-analysis.py'
      - 'scripts/test-analysis-math.cjs'
      - 'scripts/test-analysis-point-math.cjs'
      - 'scripts/test-process-capability-and-points.cjs'
      - 'scripts/test-data-analysis.cjs'
      - 'scripts/test-capability-math.cjs'
      - 'scripts/test-capability-reports.cjs'
      - 'scripts/sync-workspace-files.py'
      - 'scripts/test-analysis-session.cjs'
      - 'scripts/test-workspace-files.cjs'
      - 'scripts/workbench-browser-fixture.cjs'
      - 'scripts/test-auth-config.py'
      - 'scripts/check-account-service.py'
      - 'scripts/build-web.py'
      - 'scripts/split-web-spreadsheet.py'
      - 'scripts/test-web-downloads.cjs'
      - 'scripts/test-web-entry.cjs'
      - 'scripts/test-web-auth-bootstrap.cjs'
      - 'scripts/test-general-labels.cjs'
      - 'assets/**'
      - 'supabase/**'
      - '.github/workflows/frontend-checks.yml'

permissions:
  contents: read

jobs:
  cross-unit-calculations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check the embedded module matches its source
        run: |
          python3 scripts/sync-cross-unit-calculations.py
          python3 scripts/sync-account-auth.py
          python3 scripts/sync-data-analysis.py
          python3 scripts/sync-workspace-files.py
          python3 scripts/build-web.py
          git diff --exit-code -- '*.html' assets
          node --check frontend/cross-unit-calculations.js
          node --check frontend/account-auth.js
          node --check frontend/web-auth-bootstrap.js
          node --check frontend/web-startup.js
          node --check frontend/web-spreadsheet.js
          node scripts/test-web-auth-bootstrap.cjs
          node --check frontend/backup-merge.js
          node --check frontend/excel-sync.js
          node --check frontend/pi-daily.js
          node --check frontend/live-data.js
          node --check frontend/live-page.js
          node --check frontend/live-chart.js
          node --check frontend/chart-axes.js
          node --check frontend/dashboard.js
          node --check frontend/dashboard-page.js
          node --check frontend/live-series.js
          node --check frontend/view-defaults.js
          node --check frontend/workspace-memory.js
          node --check frontend/formula-health.js
          node --check frontend/shared-formulas.js
          node --check frontend/analysis-math.js
          node --check frontend/analysis-point-math.js
          node --check frontend/formula-syntax.js
          node --check frontend/point-exclusions.js
          node --check frontend/process-capability.js
          node --check frontend/analysis-plots.js
          node --check frontend/data-analysis.js
          node --check frontend/capability-math.js
          node --check frontend/capability-reports.js
          node --check frontend/capability-split-chart.js
          node --check frontend/analysis-drafts.js
          node --check frontend/workspace-files.js
          node scripts/test-analysis-math.cjs
          node scripts/test-analysis-point-math.cjs
          node scripts/test-capability-math.cjs
          python3 scripts/test-auth-config.py
      - name: Check account service types
        run: npx --yes deno@2.9.6 check supabase/functions/workbench-accounts/index.ts
      - name: Verify the configured account service without signing in
        run: python3 scripts/check-account-service.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-excel-sync.txt
      - name: Install and test Python Excel reader
        run: |
          python -m pip install -r requirements-excel-sync.txt
          python scripts/run-service-tests.py
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/workbench-browser-tests" --no-save --package-lock=false playwright@1.62.1
          # The tests use stable Chrome already installed on the runner.
          /usr/bin/google-chrome --version
      - name: Test cross-device calculations in the actual workbench
        env:
          # Exercise the installed stable browser, including real IndexedDB/file handles.
          CHROMIUM_PATH: /usr/bin/google-chrome
          NODE_PATH: ${{ runner.temp }}/workbench-browser-tests/node_modules
          WORKBENCH_TEST_ARTIFACTS: ${{ runner.temp }}/workbench-browser-artifacts
        run: |
          node scripts/test-cross-unit-calculations.cjs
          node scripts/test-managed-accounts.cjs
          node scripts/test-web-entry.cjs
          node scripts/test-web-downloads.cjs
          node scripts/test-general-labels.cjs
          node scripts/test-data-analysis.cjs
          node scripts/test-capability-reports.cjs
          node scripts/test-analysis-session.cjs
          node scripts/test-workspace-files.cjs
          node scripts/test-process-capability-and-points.cjs
          node scripts/test-excel-sync.cjs
          node scripts/test-excel-background.cjs
          node scripts/test-excel-auth-resume.cjs
          node scripts/test-pi-daily.cjs
          node scripts/test-device-excel-profiles.cjs
          node scripts/test-live-defaults-and-formulas.cjs
          node scripts/test-live-interactions.cjs
          node scripts/test-dashboard.cjs
          node scripts/test-workspace-memory.cjs
