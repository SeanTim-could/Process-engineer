name: Windows portable launcher

on:
  workflow_dispatch:
  push:
    branches: [main, codex/windows-portable-launcher]
    paths:
      - '.github/workflows/windows-portable.yml'
      - 'local_service/**'
      - 'scripts/verify-portable.ps1'
      - 'licenses/**'
      - 'THIRD-PARTY-NOTICES.txt'
      - '*.html'
      - '*.bat'
      - '便携版使用说明.txt'
  pull_request:
    paths:
      - '.github/workflows/windows-portable.yml'
      - 'local_service/**'
      - 'scripts/verify-portable.ps1'
      - 'licenses/**'
      - 'THIRD-PARTY-NOTICES.txt'
      - '*.html'
      - '*.bat'
      - '便携版使用说明.txt'

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: local_service/requirements-windows-build.txt
      - name: Install build dependencies
        run: python -m pip install --requirement local_service/requirements-windows-build.txt
      - name: Test local service
        run: python -m unittest discover -s local_service -v
      - name: Build portable application
        run: python local_service/build_windows.py
      - name: Verify EXE without Python on PATH
        run: ./scripts/verify-portable.ps1
      - name: Upload ready-to-extract portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Workbench-Windows-x64
          path: Windows-Build/dist/ProcessEngineerWorkbench/
          if-no-files-found: error
          retention-days: 30
