name: Windows portable launcher

on:
  workflow_dispatch:
  push:
    branches: [main, codex/windows-portable-launcher]
    tags: ['portable-*']
    paths:
      - '.github/workflows/windows-portable.yml'
      - 'local_service/**'
      - 'scripts/verify-portable.ps1'
      - 'scripts/run-service-tests.py'
      - 'licenses/**'
      - 'THIRD-PARTY-NOTICES.txt'
      - '*.html'
      - '*.bat'
      - '便携版使用说明.txt'
  pull_request:
    paths:
      - '.github/workflows/windows-portable.yml'
      - 'local_service/**'
      - 'scripts/verify-portable.ps1'
      - 'scripts/run-service-tests.py'
      - 'licenses/**'
      - 'THIRD-PARTY-NOTICES.txt'
      - '*.html'
      - '*.bat'
      - '便携版使用说明.txt'

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: local_service/requirements-windows-build.txt
      - name: Install build dependencies
        run: python -m pip install --requirement local_service/requirements-windows-build.txt
      - name: Test local service
        run: python scripts/run-service-tests.py
      - name: Build portable application
        run: python local_service/build_windows.py
      - name: Verify EXE without Python on PATH
        run: ./scripts/verify-portable.ps1
      - name: Upload ready-to-extract portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Workbench-Windows-x64
          path: |
            Windows-Build/Workbench-Windows-Portable.zip
            Windows-Build/Workbench-Windows-Portable.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish public download
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/portable-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the verified package from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Workbench-Windows-x64
          path: release
      - name: Publish a downloadable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check Workbench-Windows-Portable.zip.sha256
          if [[ "$GITHUB_REF" == refs/tags/portable-* ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="portable-build-$GITHUB_RUN_NUMBER"
          fi
          state_file="$RUNNER_TEMP/workbench-release-state.json"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json isDraft > "$state_file" 2>/dev/null; then
            if [[ "$(jq -r '.isDraft' "$state_file")" == false ]]; then
              echo 'This version is already published.'
              exit 0
            fi
          else
            cat > "$RUNNER_TEMP/workbench-release-notes.md" <<'NOTES'
          Windows 64 位便携启动器，已包含 Python 和 pywin32，使用者无需安装 Python。

          下载 Workbench-Windows-Portable.zip，完整解压后双击 ProcessEngineerWorkbench.exe。
          请保留 _internal 文件夹及其他配套文件。仍需桌面版 Microsoft Office 和自己的文档读取权限。

          本版本已通过 Windows 服务测试和移除 Python 命令后的运行验证。实际 Office 文档读取需在目标电脑验证。
          NOTES
            gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Windows 便携启动器 ($release_tag)" \
              --notes-file "$RUNNER_TEMP/workbench-release-notes.md" --draft
          fi
          gh release upload "$release_tag" --repo "$GITHUB_REPOSITORY" \
            Workbench-Windows-Portable.zip Workbench-Windows-Portable.zip.sha256 --clobber
          gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo '## Public launcher download' >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Workbench-Windows-Portable.zip" >> "$GITHUB_STEP_SUMMARY"
